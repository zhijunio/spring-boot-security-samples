<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, showLogout)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">Spring Boot Security MFA ShowCases</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header class="app-header">
    <a th:href="@{/}" class="logo">Spring Boot Security MFA ShowCases</a>
    <div class="header-actions" th:if="${showLogout}">
        <form th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </div>
</header>
<div class="main-content centered" th:insert="${content}"></div>
</body>
</html>
