<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main}, false)}">
<head>
    <title>Log In - Demo MFA</title>
</head>
<body>
<main>
    <div class="card">
        <h2>Log In</h2>
        <p class="subtitle">Sign in with your username and password.</p>
        <div th:if="${logoutSuccess}" class="alert alert-success">You have been logged out.</div>
        <div th:if="${error}" class="alert alert-error">Invalid username or password.</div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       autocomplete="username" autocapitalize="none" spellcheck="false"
                       required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>
        <p class="text-center mt-2 text-secondary">
            Don't have an account? <a th:href="@{/signup}" class="text-link">Sign up</a>
        </p>
    </div>
</main>
</body>
</html>
