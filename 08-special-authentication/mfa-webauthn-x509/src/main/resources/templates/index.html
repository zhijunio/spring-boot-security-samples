<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Account - WebAuthn + X.509 MFA</title>
</head>
<body>
<main>
    <div class="card">
        <h2>Account</h2>
        <p class="subtitle">Signed in as <strong sec:authentication="name">user</strong>. Client certificate then Passkey.</p>
        <p class="hint">Present <code>user.p12</code>, register a Passkey, then complete WebAuthn. Both factors are always required.</p>
        <p class="text-center mt-2">
            <a class="btn btn-secondary" th:href="@{/webauthn/register}">Manage Passkeys</a>
        </p>
    </div>
</main>
</body>
</html>
