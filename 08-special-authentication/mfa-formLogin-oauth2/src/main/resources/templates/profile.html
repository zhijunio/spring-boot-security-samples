<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Profile - OAuth2 Scope MFA</title>
</head>
<body>
<main>
    <div class="card">
        <h2>Profile</h2>
        <p class="subtitle">This page requires the Gmail read-only OAuth2 scope.</p>
        <p>Signed in as <strong sec:authentication="name">user</strong>.</p>
        <p class="text-center mt-2">
            <a class="text-link" th:href="@{/}">Back to home</a>
        </p>
    </div>
</main>
</body>
</html>
