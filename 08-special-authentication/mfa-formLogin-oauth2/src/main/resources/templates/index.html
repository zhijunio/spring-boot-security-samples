<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Home - OAuth2 Scope MFA</title>
</head>
<body>
<main>
    <div class="card" sec:authorize="!isAuthenticated()">
        <h2>OAuth2 step-up</h2>
        <p class="subtitle">Sign in with Google, then open Profile to request the extra Gmail read-only scope.</p>
        <a class="btn btn-primary" th:href="@{/oauth2/authorization/google}">Continue with Google</a>
    </div>
    <div class="card" sec:authorize="isAuthenticated()">
        <h2>Account</h2>
        <p class="subtitle">Signed in as <strong sec:authentication="name">user</strong>.</p>
        <p class="hint">Profile needs an extra OAuth2 scope. Opening it re-prompts Google if that scope is missing.</p>
        <p class="text-center mt-2">
            <a class="btn btn-secondary" th:href="@{/profile}">Open profile</a>
        </p>
    </div>
</main>
</body>
</html>
