<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>One-Time Token - OTT MFA</title>
</head>
<body>
<main>
    <div class="card">
        <h2>Enter token</h2>
        <p class="subtitle">Request a magic link, then paste the token from the log.</p>
        <div th:if="${param.error}" class="alert alert-error">Invalid or expired token.</div>
        <form th:action="@{/ott/generate}" method="post" sec:authorize="isAuthenticated()">
            <div class="form-group">
                <label for="ott-username">Username</label>
                <input type="text" id="ott-username" name="username" class="form-control"
                       th:value="${#authentication.name}" readonly required>
            </div>
            <button type="submit" class="btn btn-secondary">Send token</button>
        </form>
        <p class="section-title">Token</p>
        <form th:action="@{/login/ott}" method="post">
            <div class="form-group">
                <label for="token">Token</label>
                <input type="text" id="token" name="token" class="form-control"
                       th:value="${param.token}" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary">Continue</button>
        </form>
    </div>
</main>
</body>
</html>
