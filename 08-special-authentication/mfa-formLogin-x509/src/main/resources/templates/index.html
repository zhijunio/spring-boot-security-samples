<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Account - Password + X.509 MFA</title>
</head>
<body>
<main>
    <div class="card">
        <h2>Account</h2>
        <p class="subtitle">Signed in as <strong sec:authentication="name">user</strong>. Password then client certificate.</p>
        <p class="hint">Both factors are always required. Certificate CN must match the username.</p>
    </div>
</main>
</body>
</html>
