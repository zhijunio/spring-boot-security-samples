<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Log in - Password + X.509 MFA</title>
</head>
<body>
<main>
    <div class="card">
        <h2>Log in</h2>
        <p class="subtitle">Username and password first. A matching client certificate is also required.</p>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
        <div th:if="${param.error}" class="alert alert-error">Invalid username or password.</div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       autocomplete="username" autocapitalize="none" spellcheck="false"
                       required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
        <p class="hint">Demo: <code>user</code> / <code>password</code>, with <code>user.p12</code> in the browser.</p>
    </div>
</main>
</body>
</html>
