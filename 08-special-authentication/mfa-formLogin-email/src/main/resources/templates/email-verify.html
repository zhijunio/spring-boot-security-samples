<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Email verification</title>
    <link href="/main.css" rel="stylesheet"/>
</head>
<body>
<div class="content">
    <h1 class="center">Spring Boot Tutorial</h1>
    <p class="center">A verification code will be sent to your registered email address.</p>

    <form class="default-form" method="post" th:action="@{/email/request}">
        <input name="username" type="hidden" th:value="${username}">
        <button class="primary" type="submit">Send verification code</button>
    </form>

    <form class="default-form" method="post" th:action="@{/email/verify}">
        <input name="username" type="hidden" th:value="${username}">
        <p>
            <label for="code">Verification code</label>
            <input autofocus id="code" name="code" pattern="[0-9]{6}" required type="text">
        </p>
        <button class="primary" type="submit">Verify</button>
    </form>
</div>
</body>
</html>
