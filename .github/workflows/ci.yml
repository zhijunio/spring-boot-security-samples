name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  maven-test:
    name: Maven tests (${{ matrix.section }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        section:
          - 01-authentication
          - 02-web-security
          - 03-session-and-login-state
          - 04-authentication-extension
          - 05-method-authorization
          - 06-error-handling
          - 07-token-authentication
          - 08-special-authentication
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test Maven projects
        run: bash scripts/test-projects.sh "${{ matrix.section }}"
