name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  maven-test:
    name: Maven tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Test all Maven projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r pom; do
            echo "Testing ${pom}"
            mvn --batch-mode --no-transfer-progress -f "${pom}" test
          done < <(find . -type f -name pom.xml -not -path '*/target/*' | sort)
